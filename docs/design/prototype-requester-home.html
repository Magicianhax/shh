<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Requester home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ---------- shared reset ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea,input{font:inherit;color:inherit}
#stage{min-height:100%}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- picker (verbatim spec) ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}

/* ---------- shared entrance ---------- */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise 220ms cubic-bezier(.2,.8,.2,1) both}
.rise:nth-child(2){animation-delay:40ms}.rise:nth-child(3){animation-delay:80ms}.rise:nth-child(4){animation-delay:120ms}.rise:nth-child(5){animation-delay:160ms}.rise:nth-child(6){animation-delay:200ms}

/* =========================================================
   VARIANT 1 — EDITORIAL (white, display type, ink squares)
   ========================================================= */
.ed{--ink:#0a0a0a;--mute:#6b6b6b;--rule:#e6e6e6;--acc:#5b3df5;--bg:#fff;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 120px}
.ed .top{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;border-bottom:1px solid var(--rule)}
.ed .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.ed .brand i{width:22px;height:22px;background:var(--ink);display:inline-block}
.ed .nav{display:flex;gap:28px;color:var(--mute);font-size:14px}
.ed .nav b{color:var(--ink);font-weight:500}
.ed .wallet{border:1px solid var(--rule);padding:8px 14px;font-size:13px;font-family:"JetBrains Mono",monospace}
.ed .hero{padding:72px 48px 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end}
.ed h1{font-size:76px;line-height:.98;letter-spacing:-.045em;font-weight:700}
.ed h1 span{color:var(--mute)}
.ed .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ed .stat b{display:block;font-size:40px;letter-spacing:-.04em;font-weight:700;line-height:1}
.ed .stat small{display:block;margin-top:8px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ed .lab{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ed .compose{margin:0 48px;border-top:2px solid var(--ink);padding-top:20px;display:grid;grid-template-columns:1fr 280px;gap:40px}
.ed textarea{width:100%;min-height:120px;border:0;outline:0;resize:none;font-size:22px;line-height:1.35;letter-spacing:-.01em;background:transparent}
.ed textarea::placeholder{color:#b5b5b5}
.ed .meter{height:2px;background:var(--rule);margin-top:14px;overflow:hidden}
.ed .meter i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform 160ms ease-out}
.ed .side .row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.ed .side .row input{width:90px;text-align:right;border:0;outline:0;font-family:"JetBrains Mono",monospace;font-size:14px;background:transparent}
.ed .chips{display:flex;gap:6px;flex-wrap:wrap}
.ed .chip{font-family:"JetBrains Mono",monospace;font-size:12px;padding:6px 10px;border:1px solid var(--rule)}
.ed .chip[data-on]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ed .cta{margin-top:18px;width:100%;background:var(--ink);color:#fff;padding:16px;font-weight:600;font-size:15px;transition:transform 120ms ease-out}
.ed .cta:active{transform:scale(.985)}
.ed .cta[disabled]{background:#cfcfcf;cursor:default}
.ed .steps{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ed .step{height:6px;background:var(--rule);position:relative;overflow:hidden}
.ed .step i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform 320ms cubic-bezier(.2,.8,.2,1)}
.ed .step[data-done] i{transform:scaleX(1)}
.ed .steplbl{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute);margin-top:6px}
.ed .jobs{margin:64px 48px 0}
.ed .jobs header{display:grid;grid-template-columns:1.3fr 1fr 1.6fr .7fr .8fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--ink)}
.ed .job{display:grid;grid-template-columns:1.3fr 1fr 1.6fr .7fr .8fr;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background 120ms ease-out}
.ed .job:hover{background:#fafafa}
.ed .job .t{font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed .mono{font-family:"JetBrains Mono",monospace;font-size:13px}
.ed .pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ed .pipe i{height:14px;background:var(--rule);transition:background 200ms ease-out}
.ed .pipe i[data-on]{background:var(--ink)}
.ed .pipe i[data-now]{background:var(--acc)}
.ed .pipe i[data-bad]{background:#e5484d}
.ed .detail{margin:0 48px;border:1px solid var(--ink);padding:28px 32px;display:grid;grid-template-columns:1fr 1fr;gap:40px;animation:rise 220ms cubic-bezier(.2,.8,.2,1)}
.ed .detail h3{font-size:28px;letter-spacing:-.03em;font-weight:700;margin-bottom:6px}
.ed .sealed{position:relative;border:1px solid var(--rule);padding:18px;font-size:15px;line-height:1.5;min-height:120px;margin-top:10px}
.ed .sealed .body{filter:blur(7px);transition:filter 260ms ease-out;user-select:none}
.ed .sealed[data-open] .body{filter:none;user-select:text}
.ed .sealed .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:opacity 180ms ease-out}
.ed .sealed[data-open] .veil{opacity:0;pointer-events:none}
.ed .veil button{border:1px solid var(--ink);padding:8px 12px;background:#fff}
.ed .hash{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute);margin-top:8px}
.ed .acts{display:flex;gap:10px;margin-top:22px}
.ed .acts button{flex:1;padding:14px;border:1px solid var(--ink);font-weight:600;transition:transform 120ms ease-out}
.ed .acts .yes{background:var(--ink);color:#fff}
.ed .acts button:active{transform:scale(.985)}
.ed .tl{list-style:none;display:grid;gap:10px;margin-top:12px}
.ed .tl li{display:flex;gap:12px;align-items:center;font-size:14px}
.ed .tl li i{width:10px;height:10px;background:var(--rule)}
.ed .tl li[data-on] i{background:var(--ink)}
.ed .tl li[data-now] i{background:var(--acc)}
.ed .tl li small{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute)}
.ed .stamp{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;background:var(--acc);color:#fff}
.ed .stamp[data-red]{background:#e5484d}

/* =========================================================
   VARIANT 2 — TERMINAL (near-black, mono, sharp, no glow)
   ========================================================= */
.tm{--bg:#0b0b0b;--fg:#e8e8e8;--dim:#7a7a7a;--line:#242424;--acc:#3ee07f;--red:#ff5c5c;background:var(--bg);color:var(--fg);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:13px;min-height:100vh;padding:0 0 120px}
.tm .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);color:var(--dim)}
.tm .bar b{color:var(--fg);font-weight:500}
.tm .bar .dot{display:inline-block;width:7px;height:7px;background:var(--acc);margin-right:8px;vertical-align:1px;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.tm .grid{display:grid;grid-template-columns:1fr 420px;min-height:calc(100vh - 47px)}
.tm .main{padding:28px 24px;border-right:1px solid var(--line)}
.tm h1{font-family:Inter,sans-serif;font-size:44px;letter-spacing:-.035em;font-weight:600;line-height:1.05;margin-bottom:6px}
.tm .sub{color:var(--dim);margin-bottom:28px}
.tm .term{border:1px solid var(--line);background:#0e0e0e}
.tm .term .hd{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.tm .term .hd b{color:var(--acc);font-weight:500}
.tm .term textarea{width:100%;min-height:150px;padding:14px;background:transparent;border:0;outline:0;resize:none;line-height:1.55;font-family:inherit}
.tm .term textarea::placeholder{color:#4a4a4a}
.tm .term .ft{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.tm .kv{display:flex;gap:18px}
.tm .kv span b{color:var(--fg);font-weight:500}
.tm .kv input{width:64px;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--fg);font-family:inherit;text-align:right}
.tm .run{background:var(--fg);color:#000;padding:8px 14px;font-weight:500;transition:transform 100ms ease-out}
.tm .run:active{transform:scale(.97)}
.tm .run[disabled]{background:#333;color:#777;cursor:default}
.tm .log{margin-top:12px;color:var(--dim);line-height:1.7;min-height:1.7em}
.tm .log .ok{color:var(--acc)}
.tm .log .cur::after{content:"▍";animation:blink .9s steps(1) infinite;color:var(--fg)}
.tm table{width:100%;border-collapse:collapse;margin-top:28px}
.tm th{text-align:left;color:var(--dim);font-weight:400;padding:8px 8px;border-bottom:1px solid var(--line);font-size:12px}
.tm td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tm tr.j{cursor:pointer;transition:background 100ms ease-out}
.tm tr.j:hover{background:#121212}
.tm tr.j[data-sel]{background:#141414}
.tm .st{display:inline-block;padding:2px 6px;border:1px solid var(--line);font-size:11px;color:var(--dim)}
.tm .st[data-live]{color:var(--acc);border-color:var(--acc)}
.tm .st[data-done]{color:var(--fg);border-color:var(--fg)}
.tm .st[data-bad]{color:var(--red);border-color:var(--red)}
.tm .bars{display:inline-flex;gap:2px}
.tm .bars i{width:14px;height:8px;background:#1f1f1f}
.tm .bars i[data-on]{background:var(--fg)}
.tm .bars i[data-now]{background:var(--acc)}
.tm .pane{padding:28px 24px;position:sticky;top:0;align-self:start}
.tm .pane h2{font-family:Inter,sans-serif;font-size:20px;letter-spacing:-.02em;font-weight:600;margin-bottom:4px}
.tm .pane .id{color:var(--dim);font-size:12px;margin-bottom:22px}
.tm .sec{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px}
.tm .dump{border:1px solid var(--line);padding:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;position:relative;min-height:88px}
.tm .dump .cipher{color:#3a3a3a}
.tm .dump .plain{display:none}
.tm .dump[data-open] .cipher{display:none}
.tm .dump[data-open] .plain{display:block;animation:rise 200ms ease-out}
.tm .dump .unlock{position:absolute;right:10px;top:10px;border:1px solid var(--line);padding:4px 8px;font-size:11px;color:var(--fg)}
.tm .dump[data-open] .unlock{display:none}
.tm .keys{display:flex;gap:8px;margin-top:20px}
.tm .keys button{flex:1;border:1px solid var(--line);padding:12px;text-align:left;transition:border-color 120ms ease-out,transform 100ms ease-out}
.tm .keys button:hover{border-color:var(--fg)}
.tm .keys button:active{transform:scale(.98)}
.tm .keys kbd{display:inline-block;border:1px solid var(--dim);padding:0 5px;margin-right:8px;font-size:11px;color:var(--dim)}
.tm .keys .y kbd{border-color:var(--acc);color:var(--acc)}
.tm .keys .n kbd{border-color:var(--red);color:var(--red)}
.tm .evt{color:var(--dim);line-height:1.8;font-size:12px}
.tm .evt b{color:var(--fg);font-weight:500}
.tm .evt .now{color:var(--acc)}
.tm .empty{color:var(--dim);line-height:1.7}

/* =========================================================
   VARIANT 3 — LEDGER (paper, serif, hairlines, receipt)
   ========================================================= */
.lg{--paper:#f6f4ee;--ink:#1c1a17;--mute:#7d786f;--rule:#d9d4c8;--acc:#1c4f3f;--red:#9b2c2c;background:var(--paper);color:var(--ink);min-height:100vh;padding:0 0 120px;font-family:Inter,sans-serif}
.lg .serif{font-family:Fraunces,Georgia,"Times New Roman",serif}
.lg .top{display:flex;justify-content:space-between;align-items:baseline;padding:26px 56px 18px;border-bottom:1px solid var(--ink)}
.lg .top .brand{font-family:Fraunces,serif;font-size:22px;font-weight:500;letter-spacing:-.01em}
.lg .top .meta{font-size:12px;color:var(--mute);display:flex;gap:22px}
.lg .top .meta b{color:var(--ink);font-weight:500}
.lg .wrap{display:grid;grid-template-columns:1fr 380px;gap:56px;padding:48px 56px 0}
.lg h1{font-family:Fraunces,serif;font-weight:400;font-size:58px;line-height:1.02;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.lg h1 em{font-style:italic;color:var(--acc)}
.lg .lede{margin-top:14px;color:var(--mute);font-size:15px;max-width:52ch;line-height:1.55}
.lg .form{margin-top:36px}
.lg .field{border-bottom:1px solid var(--rule);padding:14px 0}
.lg .field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.lg textarea{width:100%;min-height:110px;background:transparent;border:0;outline:0;resize:none;font-family:Fraunces,serif;font-size:19px;line-height:1.45}
.lg textarea::placeholder{color:#b9b3a6;font-style:italic}
.lg .inline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.lg .inline input{width:100%;background:transparent;border:0;outline:0;font-size:16px;font-variant-numeric:tabular-nums}
.lg .bytes{font-size:12px;color:var(--mute);text-align:right;margin-top:6px}
.lg .pub{margin-top:22px;display:flex;align-items:center;gap:18px}
.lg .pub button{background:var(--ink);color:var(--paper);padding:14px 22px;font-weight:500;transition:transform 120ms ease-out}
.lg .pub button:active{transform:scale(.985)}
.lg .pub button[disabled]{background:#b6b0a3;cursor:default}
.lg .pub .prog{font-size:12px;color:var(--mute);display:flex;gap:14px}
.lg .pub .prog span[data-done]{color:var(--acc)}
.lg .pub .prog span[data-done]::before{content:"✓ "}
.lg .ledger{margin-top:56px}
.lg .ledger h2{font-family:Fraunces,serif;font-weight:400;font-size:26px;margin-bottom:10px}
.lg .lhead,.lg .lrow{display:grid;grid-template-columns:70px 1fr 120px 110px 110px;gap:14px;align-items:baseline}
.lg .lhead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:8px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.lg .lrow{padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background 120ms ease-out}
.lg .lrow:hover{background:rgba(28,26,23,.03)}
.lg .lrow .no{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}
.lg .lrow .t{font-family:Fraunces,serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .lrow .amt{text-align:right;font-variant-numeric:tabular-nums}
.lg .lrow .stt{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.lg .lrow .stt[data-live]{color:var(--acc)}
.lg .lrow .stt[data-bad]{color:var(--red)}
.lg .receipt{background:#fffdf8;border:1px solid var(--rule);padding:26px 26px 30px;position:sticky;top:24px;box-shadow:0 1px 0 #fff inset;animation:rise 220ms cubic-bezier(.2,.8,.2,1)}
.lg .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,transparent 50%,#fffdf8 50%) 0 0/12px 12px,linear-gradient(45deg,transparent 50%,#fffdf8 50%) 0 0/12px 12px}
.lg .receipt h3{font-family:Fraunces,serif;font-weight:500;font-size:22px}
.lg .receipt .id{font-size:11px;color:var(--mute);letter-spacing:.06em;margin:4px 0 18px}
.lg .line{display:flex;align-items:baseline;font-size:14px;padding:6px 0}
.lg .line .l{flex:none}
.lg .line .dots{flex:1;border-bottom:1px dotted #b9b3a6;margin:0 8px;transform:translateY(-4px)}
.lg .line .r{font-variant-numeric:tabular-nums}
.lg .line.tot{border-top:1px solid var(--ink);margin-top:8px;padding-top:10px;font-weight:600}
.lg .sealbox{margin-top:18px;border:1px solid var(--rule);padding:14px;font-family:Fraunces,serif;font-size:15px;line-height:1.5;position:relative;min-height:90px}
.lg .sealbox .body{filter:blur(6px);transition:filter 260ms ease-out;user-select:none}
.lg .sealbox[data-open] .body{filter:none;user-select:text}
.lg .sealbox .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 180ms ease-out}
.lg .sealbox[data-open] .veil{opacity:0;pointer-events:none}
.lg .sealbox .veil button{border:1px solid var(--ink);background:#fffdf8;padding:8px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.lg .stampbox{margin-top:18px;display:flex;gap:10px}
.lg .stampbox button{flex:1;padding:12px;border:1px solid var(--ink);font-weight:500;transition:transform 120ms ease-out}
.lg .stampbox .yes{background:var(--acc);color:#fff;border-color:var(--acc)}
.lg .stampbox button:active{transform:scale(.985)}
.lg .rubber{position:absolute;right:22px;top:22px;font-family:Fraunces,serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--acc);border:2px solid var(--acc);padding:6px 10px;transform:rotate(-8deg);opacity:.9;animation:stamp 260ms cubic-bezier(.2,.8,.2,1) both}
.lg .rubber[data-red]{color:var(--red);border-color:var(--red)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.4)}to{opacity:.9;transform:rotate(-8deg) scale(1)}}
.lg .hist{margin-top:18px;font-size:12px;color:var(--mute);line-height:1.8}
.lg .hist b{color:var(--ink);font-weight:500}
.lg .empty{font-family:Fraunces,serif;font-style:italic;color:var(--mute);font-size:17px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Editorial</button>
  <button class="proto-picker-item">Terminal</button>
  <button class="proto-picker-item">Ledger</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ---------- shared realistic state ---------- */
const STAGES=["Created","Open","Claimed","Submitted","Approved","Settled"];
const seed=()=>([
 {id:"7pgz…9WW3",title:"Summarize the Q3 clinical trial notes into 5 bullet points",model:"claude",price:0.010,deadline:1740,stage:3,claimedBy:"9hE2…kLmQ",promptLen:1483,outLen:412,
  prompt:"You are a careful medical writer. Summarize the attached Q3 trial notes into five bullet points, keeping dosage numbers exact and flagging any adverse-event language.",
  output:"• Enrollment reached 412 of 450 target patients by week 11.\n• Mean dose 150 mg maintained; two protocol deviations at 125 mg.\n• Three grade-2 adverse events reported, all resolved without intervention.\n• Primary endpoint trending 18% above placebo (interim, unblinded to DSMB only).\n• Recommend continuation without amendment.",
  hash:"a91f…c04e",events:[["Created","14:02:11"],["Delegated · 41 ms","14:02:12"],["Open","14:02:12"],["Claimed by 9hE2…kLmQ","14:02:19"],["Submitted · 3.8 s","14:02:23"]]},
 {id:"6Xu8…ATpS",title:"Translate onboarding email to Brazilian Portuguese",model:"gpt-4o-mini",price:0.005,deadline:3600,stage:2,claimedBy:"Fa3c…Qz9v",promptLen:920,outLen:0,
  prompt:"Translate the following onboarding email to Brazilian Portuguese. Keep the product names in English.",output:"",hash:"5be3…77a0",events:[["Created","14:05:40"],["Delegated · 38 ms","14:05:41"],["Open","14:05:41"],["Claimed by Fa3c…Qz9v","14:05:52"]]},
 {id:"BimZ…7jqE",title:"Draft a rejection note for a vendor proposal",model:"claude",price:0.008,deadline:0,stage:5,claimedBy:"9hE2…kLmQ",promptLen:640,outLen:301,
  prompt:"Write a warm, two-paragraph rejection for a vendor proposal we won't pursue this quarter.",output:"Thank you for the thoughtful proposal…",hash:"e0c1…9d2b",events:[["Created","13:41:02"],["Claimed","13:41:20"],["Submitted","13:41:31"],["Approved","13:47:05"],["Settled on Solana · 0.008 SOL","13:47:06"]]},
 {id:"9Wct…vzvs",title:"Classify 40 support tickets by urgency",model:"gpt-4o-mini",price:0.004,deadline:0,stage:5,claimedBy:"Fa3c…Qz9v",promptLen:3901,outLen:1204,prompt:"…",output:"…",hash:"11ab…f3e9",events:[["Created","12:10:00"],["Settled · refund (rejected)","12:31:44"]],rejected:true},
]);
let S={jobs:seed(),sel:0,draft:"",price:"0.010",mins:"30",model:"claude",pub:null,open:false};
const bytes=s=>new TextEncoder().encode(s).length;
const fmtLeft=s=>s<=0?"—":(s>=3600?Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m":Math.floor(s/60)+"m "+(s%60)+"s");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cipher=n=>Array.from({length:Math.min(n,220)},(_,i)=>"0123456789abcdef"[(i*7+3)%16]).join("").replace(/(.{32})/g,"$1\n");

/* publish simulation shared by all variants */
function publish(){
  if(!S.draft.trim()||S.pub)return;
  S.pub={done:0,ms:[]};render();
  const t=[420,1900,60,45];let acc=0;
  t.forEach((d,i)=>{acc+=d;setTimeout(()=>{S.pub.done=i+1;S.pub.ms[i]=d;if(i===3){
    S.jobs.unshift({id:"new…"+Math.random().toString(36).slice(2,6),title:S.draft.slice(0,64),model:S.model,price:+S.price,deadline:+S.mins*60,stage:1,claimedBy:"",promptLen:bytes(S.draft),outLen:0,prompt:S.draft,output:"",hash:"…",events:[["Created",now()],["Delegated · 41 ms",now()],["Open",now()]]});
    S.draft="";S.sel=0;S.open=false;setTimeout(()=>{S.pub=null;render()},900)}render()},acc)});
}
const now=()=>new Date().toTimeString().slice(0,8);
function decide(ok){const j=S.jobs[S.sel];if(!j||j.stage!==3)return;j.stage=ok?4:5;j.rejected=!ok;j.events.push([ok?"Approved":"Rejected",now()]);render();
  if(ok)setTimeout(()=>{j.stage=5;j.events.push(["Settled on Solana · "+j.price.toFixed(3)+" SOL",now()]);render()},1400)}
/* countdown */
setInterval(()=>{let ch=false;S.jobs.forEach(j=>{if(j.deadline>0&&j.stage<4){j.deadline--;ch=true}});if(ch)document.querySelectorAll("[data-left]").forEach(el=>{const j=S.jobs[+el.dataset.left];if(j)el.textContent=fmtLeft(j.deadline)})},1000);

/* ---------- variant 1: Editorial ---------- */
function editorial(){
  const j=S.jobs[S.sel];
  const pipe=x=>STAGES.map((_,i)=>`<i ${i<x.stage?"data-on":""} ${i===x.stage?(x.rejected?"data-bad":"data-now"):""}></i>`).join("");
  return `<div class="ed">
  <div class="top"><div class="brand"><i></i>Shh.ai</div><div class="nav"><b>Requester</b><span>Provider</span><span>Docs</span></div><div class="wallet">5GD6…hkjV · 6.69 SOL</div></div>
  <section class="hero rise"><h1>Private inference,<br><span>settled on Solana.</span></h1>
   <div class="stats"><div class="stat"><b class="tnum">41<small style="display:inline;font-size:18px;text-transform:none;letter-spacing:0"> ms</small></b><small>rollup latency</small></div><div class="stat"><b class="tnum">128</b><small>jobs settled</small></div><div class="stat"><b class="tnum">0.92</b><small>SOL paid out</small></div></div></section>
  <section class="compose rise">
   <div><div class="lab">Prompt · sealed in the TEE</div>
    <textarea id="draft" placeholder="Ask the model something only you and the provider will ever read.">${esc(S.draft)}</textarea>
    <div class="meter"><i style="transform:scaleX(${Math.min(1,bytes(S.draft)/4096)})"></i></div>
    <div class="steplbl"><span>${bytes(S.draft)} / 4096 bytes</span><span>SHA-256 committed on-chain at publish</span></div></div>
   <div class="side">
    <div class="lab" style="margin-bottom:8px">Model</div><div class="chips">${["claude","gpt-4o-mini","llama-3.1-8b"].map(m=>`<button class="chip" data-model="${m}" ${S.model===m?"data-on":""}>${m}</button>`).join("")}</div>
    <div class="row"><span class="lab">Price</span><span><input id="price" value="${S.price}"> <span class="mono">SOL</span></span></div>
    <div class="row"><span class="lab">Deadline</span><span><input id="mins" value="${S.mins}"> <span class="mono">min</span></span></div>
    <button class="cta" id="pub" ${(!S.draft.trim()||S.pub)?"disabled":""}>${S.pub?"Publishing…":"Publish privately"}</button>
    ${S.pub?`<div class="steps">${[0,1,2,3].map(i=>`<div class="step" ${S.pub.done>i?"data-done":""}><i></i></div>`).join("")}</div><div class="steplbl"><span>create</span><span>delegate</span><span>permissions</span><span>prompt ${S.pub.done>3?S.pub.ms[3]+" ms":""}</span></div>`:""}
   </div></section>
  <section class="jobs rise"><header class="lab"><span>Job</span><span>Model · price</span><span>Pipeline</span><span>Left</span><span>State</span></header>
   ${S.jobs.map((x,i)=>`<div class="job" data-sel="${i}"><div class="t">${esc(x.title)}</div><div class="mono">${x.model} · ${x.price.toFixed(3)} SOL</div><div class="pipe">${pipe(x)}</div><div class="mono" data-left="${i}">${fmtLeft(x.deadline)}</div><div><span class="stamp" ${x.rejected?"data-red":""}>${x.rejected?"Refunded":STAGES[x.stage]}</span></div></div>`).join("")}
  </section>
  ${j?`<section class="detail" style="margin-top:28px"><div><div class="lab">${j.id} · ${j.model}</div><h3>${esc(j.title)}</h3>
    <div class="lab" style="margin-top:18px">Prompt · ${j.promptLen} bytes</div>
    <div class="sealed" ${S.open?"data-open":""}><div class="body">${esc(j.prompt)}</div><div class="veil">Visible only to you and ${j.claimedBy||"the provider"}<button data-reveal>Reveal</button></div></div>
    <div class="hash">sha256 ${j.hash}</div>
    ${j.output?`<div class="lab" style="margin-top:18px">Output · ${j.outLen} bytes</div><div class="sealed" ${S.open?"data-open":""}><div class="body" style="white-space:pre-wrap">${esc(j.output)}</div><div class="veil">Sealed<button data-reveal>Reveal</button></div></div>`:""}
    ${j.stage===3?`<div class="acts"><button class="yes" data-ok="1">Approve · pay ${j.price.toFixed(3)} SOL</button><button data-ok="0">Reject · refund</button></div>`:""}
   </div><div><div class="lab">Lifecycle</div><ul class="tl">${STAGES.map((s,i)=>`<li ${i<j.stage?"data-on":""} ${i===j.stage?"data-now":""}><i></i>${s}<small>${(j.events[i]||[])[1]||""}</small></li>`).join("")}</ul>
    <div class="lab" style="margin-top:22px">Escrow</div><div class="mono" style="margin-top:8px">${j.price.toFixed(3)} SOL · ${j.stage>=5?(j.rejected?"refunded to you":"paid to provider"):"held on Solana"}</div></div></section>`:""}
  </div>`;
}

/* ---------- variant 2: Terminal ---------- */
function terminal(){
  const j=S.jobs[S.sel];
  const bars=x=>`<span class="bars">${STAGES.map((_,i)=>`<i ${i<x.stage?"data-on":""} ${i===x.stage?"data-now":""}></i>`).join("")}</span>`;
  const st=x=>`<span class="st" ${x.rejected?"data-bad":x.stage>=5?"data-done":x.stage>=1?"data-live":""}>${x.rejected?"REJECTED":STAGES[x.stage].toUpperCase()}</span>`;
  const log=S.pub?["create_job","delegate → tee","init_permissions","write_prompt ×"+Math.ceil(bytes(S.draft)/900)].map((l,i)=>`<div class="${S.pub.done>i?"ok":(S.pub.done===i?"cur":"")}">${S.pub.done>i?"✓":"·"} ${l}${S.pub.done>i?" · "+S.pub.ms[i]+" ms":""}</div>`).join(""):`<div class="cur">ready · validator devnet-tee.magicblock.app</div>`;
  return `<div class="tm">
  <div class="bar"><span><span class="dot"></span><b>inference-market</b> · devnet · tee-as</span><span>5GD6…hkjV · <b>6.69 SOL</b></span></div>
  <div class="grid"><div class="main">
   <h1 class="rise">Private inference.<br>Settled on Solana.</h1><div class="sub rise">Prompts live inside a TEE rollup. Providers read them only after claiming. You pay on approval.</div>
   <div class="term rise"><div class="hd"><span><b>SEALED</b> prompt.txt</span><span>${bytes(S.draft)}/4096 B</span></div>
    <textarea id="draft" placeholder="> describe the task…">${esc(S.draft)}</textarea>
    <div class="ft"><div class="kv"><span>model <b>${S.model}</b></span><span>price <input id="price" value="${S.price}"> SOL</span><span>ttl <input id="mins" value="${S.mins}"> min</span></div><button class="run" id="pub" ${(!S.draft.trim()||S.pub)?"disabled":""}>${S.pub?"publishing…":"publish ↵"}</button></div></div>
   <div class="log">${log}</div>
   <table class="rise"><thead><tr><th>id</th><th>task</th><th>model</th><th>price</th><th>pipeline</th><th>ttl</th><th>state</th></tr></thead><tbody>
   ${S.jobs.map((x,i)=>`<tr class="j" data-sel="${i}" ${i===S.sel?"data-sel":""}><td style="color:var(--dim)">${x.id}</td><td>${esc(x.title)}</td><td>${x.model}</td><td>${x.price.toFixed(3)}</td><td>${bars(x)}</td><td data-left="${i}">${fmtLeft(x.deadline)}</td><td>${st(x)}</td></tr>`).join("")}
   </tbody></table></div>
   <aside class="pane">${j?`<h2>${esc(j.title)}</h2><div class="id">${j.id} · ${j.model} · sha256 ${j.hash}</div>
    <div class="sec">prompt · ${j.promptLen} B</div><div class="dump" ${S.open?"data-open":""}><button class="unlock" data-reveal>decrypt ⏎</button><span class="cipher">${cipher(j.promptLen)}</span><span class="plain">${esc(j.prompt)}</span></div>
    ${j.output?`<div class="sec">output · ${j.outLen} B · from ${j.claimedBy}</div><div class="dump" ${S.open?"data-open":""}><button class="unlock" data-reveal>decrypt ⏎</button><span class="cipher">${cipher(j.outLen)}</span><span class="plain">${esc(j.output)}</span></div>`:""}
    ${j.stage===3?`<div class="keys"><button class="y" data-ok="1"><kbd>y</kbd>approve · pay ${j.price.toFixed(3)} SOL</button><button class="n" data-ok="0"><kbd>n</kbd>reject · refund</button></div>`:""}
    <div class="sec">events</div><div class="evt">${j.events.map((e,i)=>`<div><b>${e[1]}</b> ${e[0]}${i===j.events.length-1&&j.stage<5?' <span class="now">← now</span>':""}</div>`).join("")}</div>`:`<div class="empty">no job selected<br>↑ pick one from the table</div>`}</aside>
  </div></div>`;
}

/* ---------- variant 3: Ledger ---------- */
function ledger(){
  const j=S.jobs[S.sel];
  const fee=0.000005;
  return `<div class="lg">
  <div class="top"><span class="brand">Shh.ai</span><div class="meta"><span>Account <b>5GD6…hkjV</b></span><span>Balance <b>6.690 SOL</b></span><span>Network <b>Solana devnet · TEE rollup</b></span></div></div>
  <div class="wrap"><div>
   <h1 class="rise">Ask privately.<br>Pay <em>only</em> when satisfied.</h1>
   <p class="lede rise">Your prompt is sealed inside a trusted rollup. A provider claims it, answers, and the escrow settles on Solana the moment you approve.</p>
   <div class="form rise">
    <div class="field"><label>Prompt</label><textarea id="draft" placeholder="Write the request as you would to a trusted colleague…">${esc(S.draft)}</textarea><div class="bytes tnum">${bytes(S.draft)} of 4,096 bytes</div></div>
    <div class="inline"><div class="field"><label>Model</label><input id="model" value="${S.model}"></div><div class="field"><label>Price (SOL)</label><input id="price" value="${S.price}"></div><div class="field"><label>Deadline (min)</label><input id="mins" value="${S.mins}"></div></div>
    <div class="pub"><button id="pub" ${(!S.draft.trim()||S.pub)?"disabled":""}>${S.pub?"Publishing…":"Publish and fund escrow"}</button>
     ${S.pub?`<div class="prog">${["Create","Delegate","Permissions","Prompt"].map((l,i)=>`<span ${S.pub.done>i?"data-done":""}>${l}</span>`).join("")}</div>`:""}</div>
   </div>
   <div class="ledger rise"><h2>Ledger</h2><div class="lhead"><span>No.</span><span>Request</span><span>Provider</span><span style="text-align:right">Escrow</span><span>State</span></div>
    ${S.jobs.map((x,i)=>`<div class="lrow" data-sel="${i}"><span class="no">${String(1000+S.jobs.length-i).padStart(4,"0")}</span><span class="t">${esc(x.title)}</span><span style="font-size:13px;color:var(--mute)">${x.claimedBy||"—"}</span><span class="amt">${x.price.toFixed(3)} SOL</span><span class="stt" ${x.rejected?"data-bad":x.stage<5?"data-live":""}>${x.rejected?"Refunded":STAGES[x.stage]}${x.deadline>0&&x.stage<4?` · <span data-left="${i}" class="tnum">${fmtLeft(x.deadline)}</span>`:""}</span></div>`).join("")}
   </div></div>
   <aside>${j?`<div class="receipt">${j.stage>=5?`<div class="rubber" ${j.rejected?"data-red":""}>${j.rejected?"Refunded":"Settled"}</div>`:j.stage===4?`<div class="rubber">Approved</div>`:""}
    <h3>Receipt</h3><div class="id">${j.id} · ${j.model.toUpperCase()}</div>
    <div class="line"><span class="l">Escrow deposited</span><span class="dots"></span><span class="r">${j.price.toFixed(3)} SOL</span></div>
    <div class="line"><span class="l">Rollup fees</span><span class="dots"></span><span class="r">0.000 SOL</span></div>
    <div class="line"><span class="l">Network fee</span><span class="dots"></span><span class="r">${fee.toFixed(6)} SOL</span></div>
    <div class="line tot"><span class="l">${j.stage>=5?(j.rejected?"Refunded to you":"Paid to "+j.claimedBy):"Held on Solana"}</span><span class="dots"></span><span class="r">${j.price.toFixed(3)} SOL</span></div>
    <div class="sealbox" ${S.open?"data-open":""}><div class="body">${esc(j.prompt)}${j.output?`<hr style="border:0;border-top:1px dotted #b9b3a6;margin:12px 0"><span style="white-space:pre-wrap">${esc(j.output)}</span>`:""}</div><div class="veil"><button data-reveal>Unseal ${j.output?"prompt & output":"prompt"}</button></div></div>
    ${j.stage===3?`<div class="stampbox"><button class="yes" data-ok="1">Approve</button><button data-ok="0">Reject</button></div>`:""}
    <div class="hist">${j.events.map(e=>`<div><b>${e[1]}</b> — ${e[0]}</div>`).join("")}</div></div>`:`<p class="empty">Select a line in the ledger to see its receipt.</p>`}</aside>
  </div></div>`;
}

/* ---------- harness ---------- */
const variants=[editorial,terminal,ledger];
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
function render(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;stage.innerHTML=variants[current]();if(id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current);else if(e.key==='y')decide(true);else if(e.key==='n')decide(false)});
/* delegated interactions */
stage.addEventListener('input',e=>{const t=e.target;if(t.id==='draft'){S.draft=t.value;const m=stage.querySelector('.meter i');if(m)m.style.transform=`scaleX(${Math.min(1,bytes(S.draft)/4096)})`;stage.querySelectorAll('.steplbl span:first-child,.bytes,.term .hd span:last-child').forEach(el=>{el.textContent=el.classList.contains('bytes')?`${bytes(S.draft)} of 4,096 bytes`:el.closest('.hd')?`${bytes(S.draft)}/4096 B`:`${bytes(S.draft)} / 4096 bytes`});const b=document.getElementById('pub');if(b)b.disabled=!S.draft.trim()||!!S.pub}
 if(t.id==='price')S.price=t.value;if(t.id==='mins')S.mins=t.value;if(t.id==='model')S.model=t.value});
stage.addEventListener('click',e=>{const b=e.target.closest('button');const row=e.target.closest('[data-sel]');
 if(b&&b.id==='pub'){publish();return}
 if(b&&b.dataset.model){S.model=b.dataset.model;render();return}
 if(b&&b.hasAttribute('data-reveal')){S.open=!S.open;render();return}
 if(b&&b.dataset.ok!==undefined){decide(b.dataset.ok==='1');return}
 if(row){S.sel=+row.dataset.sel;S.open=false;render()}});
stage.addEventListener('keydown',e=>{if(e.target.id==='draft'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter')publish()});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
