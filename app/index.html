    <!--
      DIRECTION CONTRACT — seed key: brief-pinned/2026-09-04-r2 (no roll; the
      user pinned the world, and a pinned direction beats the roll).

      THESIS: An inference provider's product site where the sealed state is the
      product. It refuses the admin console every job board ships: no rows, no
      sortable columns, no split list-detail, no sidebar.

      OWN-WORLD: Near-black #0b0c10 ground, panels at #14161c, hairline borders,
      one violet (#8b5cf6, filled as #7c3aed) spent only on the live lifecycle
      step, the primary action, the tab underline and the seal. Status hues stay
      quieter than the accent. System stack on a 14/16/20/28/40 scale, 8-pt
      spacing, and exactly one soft radial glow, behind the hero.

      STORY: A visitor reads what the market does from an animated schematic,
      connects a wallet, writes a prompt in a chat-shaped box, watches four
      measured steps carry it into the enclave, sees each job's whole life on one
      rail, breaks the seal on the answer, and approves.

      FIRST VIEWPORT: Compact top bar. Then the hero: headline, one-line
      explainer, "Connect wallet", the Requester to TEE rollup to Provider to
      Settled schematic with flowing dashed wires and a pulsing enclave, and
      three value props.

      FORM: Landing hero collapsing into an app shell; card grid plus right-hand
      slide-over. Motion by Framer Motion; transform, opacity, filter and
      stroke-dashoffset only.

      FINISH: two batched inspection rounds, desktop and mobile, plus a clean
      design-detector pass. The shipped finish-reviewer and documenter subagents
      are disallowed for this task, so DESIGN.md is not written; that gap is
      reported rather than hidden.
    -->
