    <!--
      DIRECTION CONTRACT — seed key: brief-pinned/2026-09-04 (no roll; the user
      pinned the world, and a pinned direction beats the roll).

      THESIS: The sealed state is the product. This refuses the admin table that
      every job board ships: no rows, no sortable columns, no split list-detail.

      OWN-WORLD: Near-black graphite ground, raised panels at #12141b, hairline
      borders, one vivid violet (#6d4dfa) spent only on the live lifecycle step,
      the primary action and the seal. Status hues stay quieter than the accent.
      System stack, tight display type, one restrained accent glow behind the
      header and nowhere else.

      STORY: The requester writes a prompt, watches four steps carry it into the
      enclave, sees the job's whole life on one rail, breaks the seal on the
      answer, and approves.

      FIRST VIEWPORT: Header strip with the mark, the live TEE beacon, balance
      and wallet. Under it the composer: a large prompt field with a byte meter
      on the left, model, price and deadline segments plus "Publish privately"
      on the right. Then the job cards.

      FORM: Card grid plus right-hand slide-over.

      FINISH: two batched inspection rounds, desktop and mobile, plus a clean
      design-detector pass. The shipped finish-reviewer and documenter subagents
      are disallowed for this task, so DESIGN.md is not written; that gap is
      reported rather than hidden.
    -->

    <script type="module" src="/src/main.tsx"></script>
