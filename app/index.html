<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <!--
      Resolve the theme before the first paint: a stored choice if there is
      one, the OS preference otherwise. Anything else in storage counts as
      unset. Without this a dark-preferring visitor gets a white flash while
      the bundle loads. index.css owns color-scheme, so the browser's own
      chrome follows the same attribute.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("shh-theme");
          var t =
            v === "light" || v === "dark"
              ? v
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#171510" : "#faf9f5");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta
      name="description"
      content="Shh — the chain sees the money, never the words. Ask anything. Only the provider you choose can read it. Private inference sealed in a TEE-backed rollup and settled on Solana."
    />

      Social card. Absolute URLs are required: X and every other scraper
      resolves og:image against nothing, so a root-relative path yields no
      preview at all. Update the origin here if the deployment moves.
    -->

  <body>
    <!--
      DIRECTION CONTRACT — seed key: calm-canvas/2026-09-04-r3 (no roll; ported
      from the approved artboards in design/canvas: Main, Chat and App).

      THESIS: A private chat whose every turn is a paid, sealed job on chain.
      The ledger is public, the words are not. It refuses both the admin console
      and the dark neon dashboard the category defaults to.

      OWN-WORLD: Warm near-white canvas oklch(98.2% 0.006 80), ink at 22%
      lightness, one teal accent oklch(58% 0.09 175) on the send button, the
      live rail step and the sealed mark. Bricolage Grotesque for display,
      Instrument Sans for UI, JetBrains Mono for anything on chain. Pills at
      999px, surfaces at 14 to 28px, hairlines at oklch(92% 0.01 80), and
      exactly one radial wash, behind the landing hero.

      STORY: A visitor reads what the market does, opens the app, types into a
      chat, watches four quiet steps seal the prompt, reads the answer, and
      approves the payment inline.

      FIRST VIEWPORT: Landing hero, headline over the schematic card, then the
      proof strip. In the app, the chat: rail, thread, pinned composer.

      FORM: Landing plus a four-route app shell, chat-first. Plain CSS; no
      animation library. Transform, opacity, filter and stroke-dashoffset only.

      FINISH: two batched inspection rounds at 1440, 768 and 375 wide, plus a
      clean design-detector pass. The shipped finish-reviewer and documenter
      subagents are disallowed for this task, so DESIGN.md is not written; that
      gap is reported rather than hidden.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
