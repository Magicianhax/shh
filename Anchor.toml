[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
inference_market = "HWeUskL1BSdZid4xsbSMBeZ4YH4FsTiYpdXDFZKzyBoe"

[programs.localnet]
inference_market = "HWeUskL1BSdZid4xsbSMBeZ4YH4FsTiYpdXDFZKzyBoe"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node node_modules/tsx/dist/cli.mjs --test tests/inference_market.ts"

[hooks]

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "DELeGGvXpWV2fqJUhqcF5ZSYMS4JTLjteaAMARRSaeSh"

# The magic program exists only inside an ephemeral rollup, so a local base-layer
# validator has nothing at its address and Anchor's `Program<'info, MagicProgram>`
# check fails with InvalidProgramExecutable before any handler body runs. Map an
# executable there (the program's own .so, which is never invoked, because the
# FinishJob authorization checks reject before reaching a CPI) so the
# authorization negatives can be exercised locally.
[[test.genesis]]
address = "Magic11111111111111111111111111111111111111"
program = "target/deploy/inference_market.so"
